<style>
    /* ==========================================
   MY EXAM
========================================== */

#myExamSection{
    margin:25px 0;
}

.my-exam-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    margin-bottom:15px;
}

.my-exam-header small{
    color:#8ea0b8;
    font-size:11px;
    letter-spacing:1px;
}

.my-exam-header h2{
    margin-top:5px;
}

.my-exam-header a{

    color:#63a9ff;

    text-decoration:none;

    font-size:13px;
}


.my-exam-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:14px;
}


.my-exam-card{

    display:flex;

    gap:14px;

    padding:18px;

    background:#0d1b2d;

    border:1px solid #23354c;

    border-radius:16px;

    color:white;

    text-decoration:none;

    transition:.25s;
}


.my-exam-card:hover{

    transform:translateY(-3px);

    border-color:#438eea;
}


.my-exam-card > span{

    min-width:42px;

    height:42px;

    display:grid;

    place-items:center;

    background:#132b48;

    border-radius:12px;

    font-size:22px;
}


.my-exam-card h3{

    font-size:15px;

    margin-bottom:5px;
}


.my-exam-card p{

    color:#91a0b4;

    font-size:12px;

    line-height:1.5;
}


.my-exam-empty{

    text-align:center;

    padding:30px;

    background:#0d1b2d;

    border:1px solid #23354c;

    border-radius:18px;
}


.my-exam-empty p{

    color:#94a3b8;

    margin:10px 0 18px;
}


.my-exam-empty a{

    display:inline-block;

    padding:11px 18px;

    background:#2575fc;

    color:white;

    border-radius:10px;

    text-decoration:none;
}
</style>
