    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0F172A;
            --accent: #2563EB;
            --bg-light: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 15px -3px rgba(37, 99, 235, 0.12);
        }

        * { margin: 0; padding: 0;
         box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; 
            padding-top: 130px;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        .banner-wrapper { margin: 20px auto 30px; width: 100%; }
        .banner-box { width: 100%; height: 220px; background: linear-gradient(135deg, #0F172A, #1E3A8A); border-radius: var(--radius); overflow: hidden; }
        .banner-box img { width: 100%; height: 100%; object-fit: cover; }

        .hub-header { text-align: center; margin-bottom: 25px; }
        .hub-header h1 { font-size: 2.2rem; color: var(--primary); font-weight: 800; }
        .hub-header p { color: var(--text-muted); font-size: 1rem; }

        /* Horizontal Scrollable Filter Wrapper */
.filter-section, .archive-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 25px;
}

.filter-group {
    margin-bottom: 18px;
    position: relative;
}

.filter-group:last-child {
    margin-bottom: 0;
}

.filter-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

/* Scroll Hint Indicator on Right */
.filter-label::after {
    content: "Swipe \f061";
    font-family: "Font Awesome 6 Free";
    font-weight: 900;
    font-size: 0.75rem;
    color: var(--accent);
    background: rgba(37, 99, 235, 0.1);
    padding: 2px 8px;
    border-radius: 12px;
}

/* Horizontal Overflow Scroll Setup */
.filter-wrap {
    display: flex;
    flex-wrap: nowrap; /* Forces items in a single line */
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

/* Custom Scrollbar Styling */
.filter-wrap::-webkit-scrollbar {
    height: 4px;
}

.filter-wrap::-webkit-scrollbar-track {
    background: var(--bg-light);
    border-radius: 10px;
}

.filter-wrap::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 10px;
}

.filter-btn {
    flex: 0 0 auto; /* Prevents buttons from shrinking */
    padding: 8px 18px;
    border: 1px solid var(--border);
    background: var(--bg-light);
    color: var(--text-dark);
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
}

.filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
}

.filter-btn.active {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
}
        .archive-header { font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px; margin-bottom: 30px; }
        .ca-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; transition: all 0.3s ease; box-shadow: var(--shadow); display: flex; flex-direction: column; justify-content: space-between; }
        .ca-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: rgba(37, 99, 235, 0.4); }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .card-date { font-size: 0.82rem; color: var(--accent); font-weight: 700; background: rgba(37, 99, 235, 0.08); padding: 4px 10px; border-radius: 20px; }
        .card-tags { display: flex; gap: 5px; }
        .tag { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #F1F5F9; color: var(--text-muted); }
        .card-title { font-size: 1.15rem; color: var(--primary); margin-bottom: 10px; font-weight: 700; }
        .card-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 18px; }
        .card-link { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 10px; background: var(--bg-light); color: var(--accent); text-decoration: none; font-weight: 700; border-radius: 8px; transition: all 0.2s ease; border: 1px solid var(--border); }
        .ca-card:hover .card-link { background: var(--accent); color: #FFFFFF; }

        .load-more-container { text-align: center; margin: 20px 0 50px; }
        .btn-explore { padding: 12px 30px; background: var(--primary); color: #FFFFFF; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: all 0.25s ease; }
        .btn-explore:hover { background: var(--accent); transform: translateY(-2px); }

        .no-content { display: none; text-align: center; padding: 40px 20px; background: var(--card-bg); border: 1px dashed var(--border); border-radius: var(--radius); margin-bottom: 40px; }
        .no-content i { font-size: 2.5rem; color: var(--text-muted); margin-bottom: 10px; }

        @media (max-width: 768px) { .cards-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="header"></div>
    <main class="container">
        <section class="banner-wrapper">
            <div class="banner-box">
                <img  src="/images/current-affairs-common.webp" alt="SelectionPro Current Affairs Banner" loading="lazy">
            </div>
        </section>

        <header class="hub-header">
            <h1>Current Affairs Resource Hub</h1>
            <p>Targeted daily, topic-wise, and monthly current affairs updates for all competitive exams.</p>
        </header>

        <section class="filter-section">
            <div class="filter-group">
                <span class="filter-label"><i class="fa-solid fa-graduation-cap"></i> Select Exam</span>
                <div class="filter-wrap" id="exam-filters">
                    <button class="filter-btn active" data-type="exam" data-val="all">All Exams</button>
                    <button class="filter-btn" data-type="exam" data-val="upsc">UPSC</button>
                    <button class="filter-btn" data-type="exam" data-val="ssc">SSC</button>
                    <button class="filter-btn" data-type="exam" data-val="banking">Banking</button>
                    <button class="filter-btn" data-type="exam" data-val="railway">Railway</button>
                    <button class="filter-btn" data-type="exam" data-val="state-psc">State PSC</button>
                    <button class="filter-btn" data-type="exam" data-val="defence">Defence</button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-label"><i class="fa-solid fa-layer-group"></i> Select Category</span>
                <div class="filter-wrap" id="category-filters">
                    <button class="filter-btn active" data-type="cat" data-val="all">All Categories</button>
                    <button class="filter-btn" data-type="cat" data-val="national">National Affairs</button>
                    <button class="filter-btn" data-type="cat" data-val="international">International</button>
                    <button class="filter-btn" data-type="cat" data-val="economy">Economy & Banking</button>
                    <button class="filter-btn" data-type="cat" data-val="science">Science & Tech</button>
                    <button class="filter-btn" data-type="cat" data-val="sports">Sports</button>
                    <button class="filter-btn" data-type="cat" data-val="schemes">Govt Schemes</button>
                </div>
            </div>
        </section>

        <section class="archive-section">
            <div class="archive-header"><i class="fa-solid fa-box-archive"></i> Monthly Archives</div>
            <div class="filter-wrap" id="month-filters">
                <button class="filter-btn active" data-type="month" data-val="all">All Time</button>
                <button class="filter-btn" data-type="month" data-val="2026-09">September 2026</button>
                <button class="filter-btn" data-type="month" data-val="2026-08">August 2026</button>
               
            </div>
        </section>

        <section class="cards-grid" id="cards-container"></section>

        <div class="no-content" id="no-content-msg">
            <i class="fa-solid fa-folder-open"></i>
            <h3>No Current Affairs Found</h3>
            <p>There are no updates matching your selected filters or monthly archive yet.</p>
        </div>

        <div class="load-more-container" id="load-more-wrap">
            <button class="btn-explore" id="load-more-btn" onclick="showNextBatch()">Explore More <i class="fa-solid fa-chevron-down"></i></button>
        </div>
    </main>
<div id="footer"></div>
<div id="pwa"></div>
<script src="/includes/js/pwabanner.js"></script>
<script src="/includes/js/pwa.js"></script>
<script src="/includes/js/header.js" ></script>
<script src="/includes/js/footer.js" ></script>

<script src="/includes/js/search.js"></script>
    <script>
        let caArticles = [];
        let selectedExam = 'all';
        let selectedCat = 'all';
        let selectedMonth = 'all';
        let currentVisibleLimit = 10;

        // Fetch articles from external JSON file
        async function loadArticles() {
            try {
                const response = await fetch('articles.json');
                caArticles = await response.json();
                renderCards();
            } catch (error) {
                console.error("Error loading JSON file:", error);
            }
        }

        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', function() {
                const type = this.getAttribute('data-type');
                const value = this.getAttribute('data-val');

                this.parentElement.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');

                if (type === 'exam') selectedExam = value;
                if (type === 'cat') selectedCat = value;
                if (type === 'month') selectedMonth = value;

                currentVisibleLimit = 10;
                renderCards();
            });
        });

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            const filtered = caArticles.filter(item => {
                const examArr = item.exams.split(' ');
                const catArr = item.cats.split(' ');

                const matchExam = (selectedExam === 'all') || examArr.includes(selectedExam);
                const matchCat = (selectedCat === 'all') || catArr.includes(selectedCat);
                const matchMonth = (selectedMonth === 'all') || (item.month === selectedMonth);

                return matchExam && matchCat && matchMonth;
            });

            const noContentMsg = document.getElementById('no-content-msg');
            const loadMoreWrap = document.getElementById('load-more-wrap');

            if (filtered.length === 0) {
                noContentMsg.style.display = 'block';
                loadMoreWrap.style.display = 'none';
                return;
            }

            noContentMsg.style.display = 'none';

            const visibleArticles = filtered.slice(0, currentVisibleLimit);

            visibleArticles.forEach(item => {
                const cardHTML = `
                    <article class="ca-card">
                        <div class="card-top">
                            <span class="card-date"><i class="fa-regular fa-calendar"></i> ${item.date}</span>
                            <div class="card-tags"><span class="tag">All Exams</span><span class="tag">Daily CA</span></div>
                        </div>
<h2 class="card-title">${item.title || 'Daily Current Affairs - ' + item.date}</h2>
                        <p class="card-desc">Comprehensive daily news coverage, national & international updates, and key exam highlights.</p>
                        <a href="https://selectionpro.in/current-affairs/${item.file}" class="card-link">Explore Article <i class="fa-solid fa-arrow-right"></i></a>
                    </article>
                `;
                container.innerHTML += cardHTML;
            });

            if (filtered.length > currentVisibleLimit) {
                loadMoreWrap.style.display = 'block';
            } else {
                loadMoreWrap.style.display = 'none';
            }
        }

        function showNextBatch() {
            currentVisibleLimit += 10;
            renderCards();
        }

        document.addEventListener('DOMContentLoaded', loadArticles);
    </script>
    
</body>
</html>
