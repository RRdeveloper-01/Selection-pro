<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Choose Your Exam | Selection Pro</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
    min-height:100vh;
    padding:25px 15px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    text-align:center;
    margin:30px 0;
}

.header h1{
    font-size:32px;
    margin-bottom:10px;
}

.header p{
    color:#aeb9c9;
}

.exam-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));

    gap:15px;
}

.exam-card{

    border:1px solid #26364d;

    background:#0d1b2d;

    border-radius:18px;

    padding:25px 15px;

    text-align:center;

    cursor:pointer;

    transition:.25s;
}

.exam-card:hover{
    transform:translateY(-4px);
    border-color:#5b9cff;
}

.exam-card.selected{

    border-color:#4da3ff;

    background:#102b4c;

    box-shadow:
    0 0 0 2px rgba(77,163,255,.15);
}

.exam-icon{
    font-size:35px;
    margin-bottom:12px;
}

.exam-name{
    font-size:17px;
    font-weight:bold;
}

.check{
    margin-top:10px;
    color:#63b3ff;
    display:none;
}

.exam-card.selected .check{
    display:block;
}

.continue{

    width:100%;

    margin-top:25px;

    padding:16px;

    border:0;

    border-radius:14px;

    background:#2575fc;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    opacity:.5;
}

.continue.active{
    opacity:1;
}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>🎯 Choose Your Exams</h1>

        <p>
            Select the exams you are preparing for.
            We'll personalize Selection Pro for you.
        </p>

    </div>

    <div id="examGrid"
         class="exam-grid">
    </div>

    <button
        id="continueBtn"
        class="continue">

        Continue →

    </button>

</div>


<script src="/dashboard/exam-config.js"></script>

<script src="/dashboard/exam-personalization.js"></script>


<script>

const grid =
document.getElementById("examGrid");

const continueBtn =
document.getElementById("continueBtn");

let selectedExams = [];


/* CREATE EXAM CARDS */

Object.entries(EXAM_CONFIG)
.forEach(([id,exam]) => {

    const card =
    document.createElement("div");

    card.className = "exam-card";

    card.innerHTML = `

        <div class="exam-icon">
            ${exam.icon}
        </div>

        <div class="exam-name">
            ${exam.name}
        </div>

        <div class="check">
            ✓ Selected
        </div>

    `;

    card.onclick = () => {

        if(selectedExams.includes(id)){

            selectedExams =
            selectedExams.filter(
                x => x !== id
            );

            card.classList.remove("selected");

        }else{

            selectedExams.push(id);

            card.classList.add("selected");
        }

        updateButton();
    };

    grid.appendChild(card);

});


function updateButton(){

    continueBtn.classList.toggle(
        "active",
        selectedExams.length > 0
    );

}


continueBtn.onclick = () => {

    if(selectedExams.length === 0){
        return;
    }

    const user = {

        exams:selectedExams,

        primaryExam:selectedExams[0]

    };

    saveUserData(user);

    window.location.href="/my-dashboard.html";

};

</script>

</body>
</html>
