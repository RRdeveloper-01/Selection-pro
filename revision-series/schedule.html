            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;

            margin-bottom: 15px;
        }

            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
        }

            font-size: 22px;
            color: #475569;
            font-weight: 600;
            margin-top: 4px;
        }

            background: #f1f5f9;
            border-left: 5px solid #2563eb;
            border-radius: 8px;
            padding: 18px 24px;
            margin-bottom: 20px;

            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            color: #475569;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

            font-size: 16px;
            color: #1e293b;
            line-height: 1.5;
            font-weight: 500;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 10px;
        }

            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 18px;
            text-align: left;
            position: relative;
        }

        .step-number {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .step-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }

        .step-desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.4;

            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            font-weight: 700;
            background: #f1f5f9;
