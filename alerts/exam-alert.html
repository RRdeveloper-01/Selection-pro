<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Alerts - SelectionPro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; color: #333; padding: 15px; }
    .container { max-width: 650px; margin: 0 auto; }
    
    header { text-align: center; margin-bottom: 20px; }
    header h1 { color: #1a365d; font-size: 24px; margin-bottom: 5px; }
    header p { color: #666; font-size: 14px; }
    
    details {
      background: #ffffff;
      margin-bottom: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }
    summary {
      padding: 14px 16px;
      font-weight: 600;
      font-size: 17px;
      cursor: pointer;
      background: #1e40af;
      color: #ffffff;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    
    .link-list { list-style: none; padding: 0; margin: 0; }
    .link-list li {
      padding: 12px 16px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .link-list li:last-child { border-bottom: none; }
    
    .title-box { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
    .badge-new {
      background-color: #ef4444;
      color: white;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }
    
    .btn {
      background-color: #16a34a;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: background 0.2s ease;
    }
    .btn:hover { background-color: #15803d; }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>
</head>
